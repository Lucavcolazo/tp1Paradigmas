<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama de clases</title>
<meta name="description" content="Diagrama de clases para presentar el juego Agua, Tierra y Fuego (tp1Paradigmas): qué le pide cada clase a otra y qué devuelve.">
<style>
  :root {
    --ink: #111111;
    --mid: #555555;
    --soft: #8a8a8a;
    --faint: #d9d9d9;
    --paper: #ffffff;
    --wash: #f3f3f3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.45 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  code, .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 28px;
    flex-wrap: wrap;
    padding: 14px 24px;
    border-bottom: 1.5px solid var(--ink);
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 span { font-weight: 400; color: var(--mid); }
  .legend { display: flex; gap: 8px 22px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--mid); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }

  .stage { position: relative; flex: 1; min-height: 0; }
  #diagram { width: 100%; height: 100%; display: block; }

  .caption {
    border-top: 1.5px solid var(--ink);
    padding: 12px 24px 14px;
    display: flex;
    gap: 12px 28px;
    align-items: center;
    flex-wrap: wrap;
  }
  .caption .text { flex: 1 1 560px; min-width: 0; }
  .step-tag { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--mid); }
  .step-title { font-size: 18px; font-weight: 700; margin: 1px 0 3px; }
  .step-body { margin: 0; color: #222; max-width: 118ch; }
  .step-body code { font-size: 13.5px; background: var(--wash); padding: 0 4px; border-radius: 3px; }
  .nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .progress { display: flex; gap: 5px; margin-right: 6px; }
  .progress i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .progress i.on { background: var(--ink); }

  button {
    font: inherit;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 7px 14px;
    min-height: 36px;
    cursor: pointer;
  }
  button:hover { background: var(--wash); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button:disabled { opacity: .3; cursor: default; background: var(--paper); }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover { background: #333; }
  .picker { gap: 0; }
  .picker-label { font-size: 12px; color: var(--mid); text-transform: uppercase; letter-spacing: .08em; margin-right: 10px; }
  .picker button { border-radius: 0; margin-left: -1.5px; }
  .picker button:first-of-type { border-radius: 6px 0 0 6px; margin-left: 0; }
  .picker button:last-of-type { border-radius: 0 6px 6px 0; }
  .picker button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* ---------- SVG ---------- */
  .box { cursor: pointer; transition: opacity .2s; }
  .box rect { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; transition: fill .2s; }
  .box:hover rect { stroke-width: 2.8; }
  .box .name { font-size: 19px; font-weight: 700; fill: var(--ink); }
  .box.abstract .name { font-style: italic; }
  .box .stereo { font-size: 12.5px; fill: var(--mid); }
  .box .role { font-size: 13px; fill: var(--mid); }
  .box.sel rect { fill: var(--ink); }
  .box.sel text { fill: var(--paper); }

  .edge { transition: opacity .2s; }
  .edge .line { fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .edge.struct .line { stroke: var(--mid); }
  .edge.realize .line, .edge.uses .line { stroke-dasharray: 7 5; }
  .edge.on .line { stroke-width: 2.4; stroke: var(--ink); }
  .dots {
    fill: none;
    stroke: var(--ink);
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-dasharray: 0 18;
    animation: flow 1.1s linear infinite;
  }
  .edge.rev .dots { animation-direction: reverse; }
  .edge.struct .dots { display: none; }
  .edge.struct.anim .dots { display: inline; }
  @keyframes flow { to { stroke-dashoffset: -18; } }

  .lbl {
    font-size: 13px;
    fill: var(--ink);
    paint-order: stroke;
    stroke: var(--paper);
    stroke-width: 6px;
    stroke-linejoin: round;
  }
  .lbl.ret { font-size: 12px; fill: var(--mid); opacity: 0; transition: opacity .2s; }
  .edge.on .lbl.ret { opacity: 1; }
  .lbl.msg { display: none; }
  .edge.anim .lbl.msg { display: inline; }
  .lbl.static { font-size: 12px; fill: var(--mid); }

  svg.focus .box:not(.on) { opacity: .2; }
  svg.focus .edge:not(.on) { opacity: .1; }

  @media (prefers-reduced-motion: reduce) {
    .dots { animation: none; stroke-dasharray: none; stroke-width: 0; }
  }

  /* ---------- panel de clase ---------- */
  .panel {
    position: absolute;
    top: 14px;
    right: 14px;
    width: min(380px, calc(100% - 28px));
    max-height: calc(100% - 28px);
    overflow: auto;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    padding: 16px 18px 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .14);
    display: none;
  }
  .panel.open { display: block; }
  .panel .kind { font-size: 12px; color: var(--mid); text-transform: uppercase; letter-spacing: .08em; }
  .panel h2 { margin: 2px 0 2px; font-size: 22px; }
  .panel .file { font-size: 12.5px; color: var(--mid); }
  .panel .desc { margin: 8px 0 0; font-size: 14px; }
  .panel h3 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--mid);
    margin: 14px 0 6px;
    padding-top: 10px;
    border-top: 1px solid var(--faint);
  }
  .panel ul { margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
  .panel li { margin: 0 0 8px; }
  .panel li code { font-size: 12.5px; background: var(--wash); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
  .panel .who { font-weight: 700; }
  .panel .ret-txt { display: block; color: var(--mid); font-size: 12.5px; margin-top: 1px; }
  .panel .none { color: var(--soft); }
  .panel .close { position: absolute; top: 10px; right: 10px; padding: 3px 10px; min-height: 0; font-size: 13px; }

  @media (max-width: 760px) {
    body { height: auto; overflow: auto; }
    .stage { flex: none; height: 62vh; }
    header, .caption { padding: 12px 16px; }
    .panel { position: fixed; top: auto; bottom: 12px; max-height: 60vh; }
  }
</style>
</head>
<body>

<div class="stage">

<script>
/* ------------------------------------------------------------------
   Clases (sin atributos): posición, rol y qué reciben al crearse.
------------------------------------------------------------------- */
const BOX_H = 84;

const CLASSES = {

/* ------------------------------------------------------------------

   fs/ts: lado de salida/llegada; ft/tt: posición 0..1 sobre ese lado.
   lab: [x, y, anchor] del texto; retAt: [x, y] opcional para "devuelve".
------------------------------------------------------------------- */

const STRUCTS = [
  { id: 's-human', kind: 'inherit', from: 'HumanPlayer', fs: 'top', to: 'Player', ts: 'bottom',

/* ------------------------------------------------------------------
   Recorrido de una partida, paso a paso.
------------------------------------------------------------------- */
const AI_OPTIONS = {
  RandomAI:    { name: 'IA Aleatoria' },
  StrategicAI: { name: 'IA Estratégica' },
  SuperAI:     { name: 'Super IA' },
};
let chosenAI = 'SuperAI';

// Los pasos en los que la IA piensa dependen de cuál se eligió en el menú.
function aiSteps(ai) {
  const intro = 'AIPlayer le pide <code>Choose(available, rival)</code> a su <code>IStrategy</code>, sin saber qué IA hay adentro.';
  const steps = {
    RandomAI: [{ key: 'ai', title: 'La IA elige: IA Aleatoria',
      body: `${intro} El objeto real es un <code>RandomAI</code>: sortea una de las unidades vivas sin mirar al rival ni consultar la tabla, y la devuelve.`,
      classes: ['AIPlayer', 'IStrategy', 'RandomAI'], flows: ['ai-strat'],
      structs: ['s-random'], anim: ['s-random'] }],
    StrategicAI: [{ key: 'ai', title: 'La IA elige: IA Estratégica',
      body: `${intro} El objeto real es un <code>StrategicAI</code>: para cada unidad le pide a la tabla <code>GetDamage()</code> cuánto hace y cuánto recibe, calcula la ventaja (hace − recibe) y devuelve la de mayor ventaja. Si empatan, la de más energía.`,
      classes: ['AIPlayer', 'IStrategy', 'StrategicAI', 'EffectivenessTable'], flows: ['ai-strat', 'st-table'],
      structs: ['s-strategic'], anim: ['s-strategic'] }],
    SuperAI: [
      { key: 'ai', title: 'La IA elige: Super IA intenta rematar',
        body: `${intro} El objeto real es un <code>SuperAI</code>: como hereda de StrategicAI, también es una IStrategy, pero corre <b>su propio</b> <code>Choose()</code> (override). Con <code>DamageDealt()</code>, heredado de StrategicAI, le pregunta a la tabla cuánto le hace cada unidad al rival. Si alguna lo remata de un golpe, devuelve la que lo hace con lo justo.`,
        classes: ['AIPlayer', 'IStrategy', 'StrategicAI', 'SuperAI', 'EffectivenessTable'], flows: ['ai-strat', 'st-table'],
        structs: ['s-strategic', 's-super'],
        anim: [{ id: 's-strategic', msg: 'Choose()' }, { id: 's-super', msg: 'override Choose()', rev: true }] },
      { key: 'ai-2', title: 'Super IA: si no puede rematar',
        body: 'Si ninguna unidad remata, <code>finisher</code> queda en <code>null</code> y SuperAI llama a <code>base.Choose()</code>: se ejecuta el Choose() de su padre, StrategicAI, que consulta la tabla y elige por mayor ventaja. SuperAI devuelve esa unidad a AIPlayer.',
        classes: ['AIPlayer', 'SuperAI', 'StrategicAI', 'EffectivenessTable'], flows: ['st-table'],
        structs: ['s-super'], anim: [{ id: 's-super', msg: 'base.Choose()', rev: false }] },
    ],
  };
  return steps[ai];
}

function buildSteps(ai) {
  const aiName = AI_OPTIONS[ai].name;
  return [
    { key: 'overview', title: 'Vista general',
      body: 'Cada flecha con puntos en movimiento es un <b>mensaje</b>: una clase le pide algo a otra llamando a un método. Hacé clic en una clase para ver qué recibe, qué pide y qué devuelve. Elegí la IA rival y usá <b>Siguiente</b> (o la flecha derecha del teclado) para recorrer una partida.',
      all: true },
    { key: 'start', title: 'Arranca el programa',
      body: '<code>Program.Main()</code> le pide a <code>EffectivenessTable.CreateDefault()</code> la tabla de daño. Recibe la tabla ya cargada con las 9 reglas (por ejemplo, Agua le hace 50% a Fuego).',
      classes: ['Program', 'EffectivenessTable'], flows: ['p-table'] },
    { key: 'menu', title: 'Elegir el rival',
      body: `Program crea el <code>StrategySelector</code> y le pide a <code>Screen</code> que muestre el menú con <code>AskForStrategy()</code>. Screen le pide a StrategySelector la lista de IAs (<code>Strategies</code>, o <code>PickRandom()</code> si se elige Sorpresa). En el menú se eligió <b>${aiName}</b>: Screen le devuelve a Program ese objeto <code>${ai}</code>, visto como <code>IStrategy</code>.`,
      classes: ['Program', 'Screen', 'StrategySelector', 'IStrategy', ai], flows: ['p-sel', 'p-screen', 'screen-sel'] },
    { key: 'deal', title: 'Repartir los elementos',
      body: 'Program llama dos veces a <code>Generate(5)</code>, una por jugador. PokemonGenerator crea cada <code>Pokemon</code> con un tipo al azar y devuelve la lista como <code>List&lt;ElementalUnit&gt;</code>: el resto del juego solo conoce el tipo base.',
      classes: ['Program', 'PokemonGenerator', 'Pokemon', 'ElementalUnit'], flows: ['p-gen', 'gen-poke'], structs: ['s-pokemon'] },
    { key: 'players', title: 'Crear jugadores y partida',
      body: `Con esas listas, Program crea <code>HumanPlayer</code> (con la Screen) y <code>AIPlayer</code> (con la ${aiName} como su IStrategy). Después crea <code>Match</code>, le pasa los dos jugadores, la tabla y la pantalla, y llama a <code>Play()</code>.`,
      classes: ['Program', 'HumanPlayer', 'AIPlayer', 'Match'], flows: ['p-match'] },
    { key: 'prepare', title: 'Cada ronda: preparar unidades',
      body: 'Match le pide a cada jugador <code>PrepareUnit(rival)</code>. Si su unidad murió, <code>Player</code> llama a <code>ChooseUnit()</code> sin saber quién es: se ejecuta la versión de HumanPlayer o la de AIPlayer según el objeto real. Eso es <b>polimorfismo</b>.',
      classes: ['Match', 'Player', 'HumanPlayer', 'AIPlayer'], flows: ['m-player'], structs: ['s-human', 's-ai'], anim: ['s-human', 's-ai'] },
    { key: 'human', title: 'El humano elige',
      body: 'HumanPlayer le pide a Screen <code>AskForUnit(available, rival)</code>: se muestran las unidades vivas, el usuario escribe un número y Screen devuelve la unidad elegida.',
      classes: ['HumanPlayer', 'Screen'], flows: ['h-screen'] },
    ...aiSteps(ai),
    { key: 'attack', title: 'El ataque',
      body: 'Match le pide a la unidad atacante <code>Attack(defender, table)</code>. La unidad le pide a la tabla <code>GetDamage(su tipo, tipo del defensor)</code>, llama a <code>defender.TakeDamage(daño)</code> y le devuelve a Match cuánta energía le sacó realmente.',
      classes: ['Match', 'ElementalUnit', 'EffectivenessTable', 'ElementType'], flows: ['m-unit', 'u-table'], structs: ['s-type', 's-table-type'] },
    { key: 'end', title: 'Mostrar y terminar',
      body: 'Match le pasa a Screen lo que pasó: <code>ShowAttack()</code>, <code>ShowSummary()</code> y <code>ShowStatus()</code>. Repite las rondas mientras los dos jugadores tengan unidades vivas y al final llama a <code>ShowResult(ganador)</code>.',
      classes: ['Match', 'Screen'], flows: ['m-screen'] },
  ];
}
let STEPS = buildSteps(chosenAI);

/* ------------------------------------------------------------------ */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('diagram');
const edgesLayer = document.getElementById('edges');
const boxesLayer = document.getElementById('boxes');
const G = {};
const boxEls = {};
const edgeEls = {};
let step = 0;
let selected = null;

function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

/* ---------- cajas ---------- */
for (const [id, c] of Object.entries(CLASSES)) {
  G[id] = { x: c.x, y: c.y, w: c.w, h: BOX_H };
  const g = svgEl('g', { class: 'box' + (c.stereo === 'abstract' || c.stereo === 'interface' ? ' abstract' : ''), tabindex: 0, role: 'button', 'aria-label': `Clase ${id}` });
  g.append(svgEl('rect', { x: c.x, y: c.y, width: c.w, height: BOX_H, rx: 6 }));
  const cx = c.x + c.w / 2;
  if (c.stereo) {
    g.append(svgEl('text', { x: cx, y: c.y + 22, 'text-anchor': 'middle', class: 'stereo' }, `«${c.stereo}»`));
    g.append(svgEl('text', { x: cx, y: c.y + 47, 'text-anchor': 'middle', class: 'name' }, id));
    g.append(svgEl('text', { x: cx, y: c.y + 69, 'text-anchor': 'middle', class: 'role' }, c.role));
  } else {
    g.append(svgEl('text', { x: cx, y: c.y + 38, 'text-anchor': 'middle', class: 'name' }, id));
    g.append(svgEl('text', { x: cx, y: c.y + 62, 'text-anchor': 'middle', class: 'role' }, c.role));
  }
  g.addEventListener('click', () => selectClass(id));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectClass(id); } });
  boxesLayer.append(g);
  boxEls[id] = g;
}

/* ---------- líneas ---------- */
function anchor(g, side, t = .5) {
  return {
    top:    { x: g.x + g.w * t, y: g.y },
    bottom: { x: g.x + g.w * t, y: g.y + g.h },
    left:   { x: g.x, y: g.y + g.h * t },
    right:  { x: g.x + g.w, y: g.y + g.h * t },
  }[side];
}

function route(e, a, b) {
  if (e.via) return [a, ...e.via(a, b), b];
  const vertical = s => s === 'top' || s === 'bottom';
  if (vertical(e.fs) && vertical(e.ts)) {
    const y = (a.y + b.y) / 2;
    return [a, { x: a.x, y }, { x: b.x, y }, b];
  }
  if (!vertical(e.fs) && !vertical(e.ts)) {
    const x = (a.x + b.x) / 2;
    return [a, { x, y: a.y }, { x, y: b.y }, b];
  }
  return vertical(e.fs) ? [a, { x: a.x, y: b.y }, b] : [a, { x: b.x, y: a.y }, b];
}

function pathFrom(points, radius = 10) {
  const pts = points.filter((p, i) => i === 0 || Math.hypot(p.x - points[i - 1].x, p.y - points[i - 1].y) > .5);
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p = pts[i], p1 = pts[i + 1];
    const d0 = Math.hypot(p.x - p0.x, p.y - p0.y), d1 = Math.hypot(p1.x - p.x, p1.y - p.y);
    const r = Math.min(radius, d0 / 2, d1 / 2);
    const s = { x: p.x - (p.x - p0.x) / d0 * r, y: p.y - (p.y - p0.y) / d0 * r };
    const t = { x: p.x + (p1.x - p.x) / d1 * r, y: p.y + (p1.y - p.y) / d1 * r };
    d += ` L${s.x},${s.y} Q${p.x},${p.y} ${t.x},${t.y}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last.x},${last.y}`;
}

function label(g, e, text, cls, at) {
  const [x, y, anchorPos = 'middle'] = at;
  g.append(svgEl('text', { x, y, 'text-anchor': anchorPos, class: 'lbl ' + cls }, text));
}

function drawEdge(e, type) {
  const a = anchor(G[e.from], e.fs, e.ft ?? .5);
  const b = anchor(G[e.to], e.ts, e.tt ?? .5);
  const d = pathFrom(route(e, a, b));
  const cls = type === 'flow' ? 'edge flow' : `edge struct ${e.kind}`;
  const g = svgEl('g', { class: cls + (e.rev ? ' rev' : '') });
  const marker = type === 'flow' ? 'm-msg' : e.kind === 'uses' ? 'm-open' : 'm-tri';
  g.append(svgEl('path', { class: 'line', d, 'marker-end': `url(#${marker})` }));
  g.append(svgEl('path', { class: 'dots', d }));
  if (type === 'flow') {
    label(g, e, e.send, 'mono', e.lab);
    if (e.ret) label(g, e, e.retShort ?? `devuelve: ${e.ret}`, 'ret', e.retAt ? [...e.retAt, e.lab[2]] : [e.lab[0], e.lab[1] + 16, e.lab[2]]);
  } else if (e.msg) {
    label(g, e, e.msg, 'msg mono', e.lab);
  } else if (e.staticLabel) {
    label(g, e, e.staticLabel, 'static mono', e.lab);
  }
  edgesLayer.append(g);
  edgeEls[e.id] = g;
}
STRUCTS.forEach(s => drawEdge(s, 'struct'));
FLOWS.forEach(f => drawEdge(f, 'flow'));

/* ---------- resaltado ---------- */
function focus({ classes = [], flows = [], structs = [], anim = [], sel = null, all = false }) {
  svg.classList.toggle('focus', !all);
  for (const [id, el] of Object.entries(boxEls)) {
    el.classList.toggle('on', all || classes.includes(id));
    el.classList.toggle('sel', id === sel);
  }
  for (const f of FLOWS) {
    const el = edgeEls[f.id];
    el.style.display = all && f.tourOnly ? 'none' : '';
    el.classList.toggle('on', !all && flows.includes(f.id));
  }
  const animById = Object.fromEntries(anim.map(a => typeof a === 'string' ? [a, {}] : [a.id, a]));
  for (const s of STRUCTS) {
    const el = edgeEls[s.id];
    const a = animById[s.id];
    el.classList.toggle('on', all || structs.includes(s.id));
    el.classList.toggle('anim', !!a);
    el.classList.toggle('rev', a && a.rev !== undefined ? a.rev : !!s.rev);
    const msg = el.querySelector('.lbl.msg');
    if (msg) msg.textContent = (a && a.msg) || s.msg;
  }
}

/* ---------- recorrido ---------- */
const progress = document.getElementById('progress');
function buildProgress() {
  progress.innerHTML = '';
  STEPS.forEach(() => progress.append(document.createElement('i')));
}
buildProgress();

// Cambia la IA del recorrido y se queda en el paso equivalente.
function chooseAI(ai) {
  const key = STEPS[step].key;
  chosenAI = ai;
  STEPS = buildSteps(ai);
  buildProgress();
  document.querySelectorAll('#aiPicker button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ai === ai)));
  const same = STEPS.findIndex(s => s.key === key);
  showStep(same >= 0 ? same : STEPS.findIndex(s => s.key === 'ai'));
}

function showStep(i) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  closePanel(false);
  const s = STEPS[step];
  document.getElementById('stepTag').textContent = step === 0 ? 'Diagrama de clases' : `Paso ${step} de ${STEPS.length - 1}`;
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('stepBody').innerHTML = s.body;
  [...progress.children].forEach((dot, k) => dot.classList.toggle('on', k === step));
  document.getElementById('prev').disabled = step === 0;
  document.getElementById('next').disabled = step === STEPS.length - 1;
  document.getElementById('next').textContent = step === 0 ? 'Recorrer una partida ›' : 'Siguiente ›';
  focus(s.all ? { all: true } : s);
}

/* ---------- panel de clase ---------- */
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function item(who, send, ret) {
  return `<li><span class="who">${esc(who)}</span>: <code>${esc(send)}</code>` +
    (ret ? `<span class="ret-txt">devuelve: ${esc(ret)}</span>` : '') + '</li>';
}
function list(items) {
  return items.length ? `<ul>${items.join('')}</ul>` : '<ul><li class="none">Nadie.</li></ul>';
}

function selectClass(id) {
  selected = id;
  const c = CLASSES[id];
  const incoming = FLOWS.filter(f => f.to === id).map(f => item(f.from, f.send, f.ret))
    .concat((c.inExtra || []).map(x => item(...x)));
  const outgoing = FLOWS.filter(f => f.from === id).map(f => item(f.to, f.send, f.ret))
    .concat((c.outExtra || []).map(x => item(...x)));
  const parents = STRUCTS.filter(s => s.from === id && s.kind !== 'uses')
    .map(s => `<li>${s.kind === 'realize' ? 'Implementa' : 'Hereda de'} <span class="who">${s.to}</span></li>`);
  const children = STRUCTS.filter(s => s.to === id && s.kind !== 'uses')
    .map(s => `<li><span class="who">${s.from}</span> ${s.kind === 'realize' ? 'la implementa' : 'hereda de esta clase'}</li>`);
  const family = parents.concat(children);

  panelBody.innerHTML = `
    <div class="kind">${c.kind}</div>
    <h2>${id}</h2>
    <div class="file mono">${c.file}</div>
    <p class="desc">${c.desc}</p>
    <h3>Qué recibe al crearse</h3>
    <ul><li>${esc(c.ctor)}</li></ul>
    <h3>Qué le piden (y qué devuelve)</h3>
    ${list(incoming)}
    <h3>Qué les pide a otras clases</h3>
    ${list(outgoing)}
    ${family.length ? `<h3>Herencia e interfaces</h3><ul>${family.join('')}</ul>` : ''}`;
  panel.classList.add('open');

  const flows = FLOWS.filter(f => f.from === id || f.to === id);
  const structs = STRUCTS.filter(s => s.from === id || s.to === id);
  const classes = [...new Set([id, ...flows.flatMap(f => [f.from, f.to]), ...structs.flatMap(s => [s.from, s.to])])];
  focus({ classes, flows: flows.map(f => f.id), structs: structs.map(s => s.id), sel: id });
}

function closePanel(restore = true) {
  panel.classList.remove('open');
  selected = null;
  if (restore) showStep(step);
}

/* ---------- controles ---------- */
document.getElementById('prev').addEventListener('click', () => showStep(step - 1));
document.getElementById('next').addEventListener('click', () => showStep(step + 1));
document.getElementById('overview').addEventListener('click', () => showStep(0));
document.getElementById('closePanel').addEventListener('click', () => closePanel());
document.querySelectorAll('#aiPicker button').forEach(b => b.addEventListener('click', () => chooseAI(b.dataset.ai)));
document.getElementById('fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
});
document.addEventListener('keydown', e => {
  const onControl = e.target.closest && e.target.closest('button, [role="button"]');
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onControl)) { e.preventDefault(); showStep(step + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showStep(step - 1); }
  else if (e.key === 'Escape') { selected ? closePanel() : showStep(0); }
  else if (e.key === 'f' || e.key === 'F') { document.getElementById('fullscreen').click(); }
  else if (['1', '2', '3'].includes(e.key)) { chooseAI(Object.keys(AI_OPTIONS)[Number(e.key) - 1]); }
});
svg.addEventListener('click', e => { if (e.target === svg && selected) closePanel(); });

showStep(0);
</script>
</body>
</html>
